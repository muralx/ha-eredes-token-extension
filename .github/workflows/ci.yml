name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm run check
      - run: npm test
      - name: Manifest is valid JSON with the expected permissions
        run: |
          node -e '
            const m = JSON.parse(require("fs").readFileSync("extension/manifest.json", "utf8"));
            const allowed = ["cookies", "storage", "notifications"];
            const extra = m.permissions.filter((p) => !allowed.includes(p));
            if (m.manifest_version !== 3 || extra.length) { console.error("unexpected permissions:", extra); process.exit(1); }
          '
